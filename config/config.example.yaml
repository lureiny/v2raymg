# v2raymg configuration
# Copy to config.yaml and modify.

# Node role. Only "end" exists — the center node was removed; see the note at the
# bottom of this file. Kept so old configs still parse.
node_type: end

log:
  level: info          # debug / info / warn / error
  format: text         # text / json
  output: stdout       # stdout / stderr / file path
  add_source: true     # include caller file:line in log output

store:
  dsn: /var/lib/v2raymg/data.db

forward:
  # 进程级唯一的端口权威:用户侧转发端口与各容器的 inbound 后端端口共用这一个
  # 分配表,任何组件都不会拿到重复端口。
  #
  # min_port / max_port 只是**随机抽签**的范围。显式指定的端口(inbound 配置里
  # 写死的 port、重启后要原样恢复的持久化端口)不受这个范围限制,只要在
  # [1024, 65535] 内就能被记账保护。所以收窄这里不会让存量端口失效。
  #
  # 注意 key 必须带下划线(loader 按结构体 yaml tag 解析)。2.8.x 之前这里写的是
  # minport / maxport / userandom,与 tag 不匹配,被 yaml 静默丢弃 —— 也就是说
  # 那时改这几个值从来没有生效过,一直在吃代码里的默认值。
  min_port: 10000
  max_port: 60000
  # 额外永不分配的端口。进程与子进程的管理端口(rpc_port / http_port /
  # xray grpc_port / hysteria traffic_stats_port / mihomo external_controller)
  # 由启动流程自动加入,不需要在这里重复。
  reserved: []
  # 转发监听默认使用的 IP 协议栈:dual(默认,同时监听 IPv4+IPv6)/ ipv4 / ipv6。
  # 未设置时按 dual 处理;单条转发规则可通过 listen_addr / listen_stack 覆盖。
  # 注意 key 必须带下划线(loader 按结构体 yaml tag 解析)。
  listen_stack: dual

cert_mgmt:
  email: ""
  path: /etc/v2raymg/certs
  # Renewal lead time: how long BEFORE expiry auto-renew starts attempting.
  # renew_before_hours (HOURS) takes precedence; falls back to renew_before_days
  # (DAYS); if neither is set, defaults to 24h. The expiry scan itself runs every
  # 1 minute (hardcoded, not configurable). Renewed certs are written in place and
  # the proxy cores hot-reload them from disk — no container restart.
  renew_before_hours: 24
  renew_before_days: 30
  challenge:
    type: ""           # dns01 / http01 (also accepts dns / http) / leave empty to skip
    dns:
      provider_name: ""
      credentials: {}                  # provider env vars, e.g. {CF_DNS_API_TOKEN: "..."}
      resolvers: []
      disable_complete_propagation: false
      timeout_sec: 0
    http:
      mode: ""                  # server (default) / webroot / memcached
      listen_addr: ""           # listen address for server mode, e.g. ":80"
      web_root: ""              # webroot directory path
      memcached_hosts: []       # memcached server addresses
      proxy_header: ""          # reverse-proxy header, default "Host"

subscription:
  remote_urls: []
  # External Clash sub-converter template services. When a client requests a
  # Clash/mihomo subscription, v2raymg queries these (in order, with a throwaway
  # node) to pull back a full Clash config skeleton — proxy-groups + rules — that
  # the generated proxies are injected into. The first URL that responds wins.
  # Each entry MUST contain a single "%s" placeholder; it is replaced with the
  # URL-encoded trigger subscription. Entries without "%s" are skipped.
  # If this list is empty, or every URL fails, /sub degrades to a built-in
  # minimal template (one "Manual" selector + a MATCH rule): the request still
  # succeeds, just without the rich third-party routing rules.
  # NOTE: these are public third-party services — they see the fake trigger node
  # (not your real nodes), but for privacy/availability you may want to self-host
  # a sub-converter and point here instead.
  clash_template_urls:
    - "https://sub.xeton.dev/sub?target=clash&new_name=true&url=%s"
    - "https://api.dler.io/sub?target=clash&new_name=true&url=%s"
    - "https://sub.maoxiongnet.com/sub?target=clash&new_name=true&url=%s"
    - "https://sub.id9.cc/sub?target=clash&new_name=true&url=%s"
  # When true (default), /sub responses include the Subscription-Userinfo header.
  # upload/download are aggregated from all target nodes; total/expire come from
  # the access node only (no global usage stats today, so they may diverge from
  # what other nodes record for the same user).
  enable_userinfo_header: true
  # Custom schema for the Subscription-Userinfo header.
  # ${var} placeholders supported — full list in docs/http-api-reference.md.
  # Empty value falls back to the built-in default:
  #   upload=${upload}; download=${download}; total=${total}; expire=${expire}
  # The per-request ?sub_userinfo_format= query parameter overrides this value.
  userinfo_header_format: ""

containers:
  containers:
    - type: xray
      enabled: true
      config:
        binary_path: /usr/local/bin/xray    # path to xray binary
        config_file: /etc/v2raymg/xray.json # xray config file path (key: config_file)
        grpc_port: 62789                    # xray gRPC API port (int, not address string)
        auto_download: true                 # auto-download xray binary if not found
        debug: false                        # enable gRPC debug logging

    - type: hysteria
      enabled: false
      config:
        binary_path: /usr/local/bin/hysteria
        config_file_path: /etc/v2raymg/hysteria.yaml
        listen: 0.0.0.0
        port: 443
        domain: example.com                 # domain for TLS cert lookup
        cert_file: ""                       # explicit cert file (overrides domain lookup)
        key_file: ""                        # explicit key file (overrides domain lookup)
        traffic_stats_port: 9999
        traffic_stats_secret: ""            # auto-generated if empty
        version: app/v2.7.1                 # hysteria version to auto-download

    - type: snell
      enabled: false
      config:
        binary_path: /usr/local/bin/snell-server
        config_file_path: /etc/v2raymg/snell.conf
        listen: 127.0.0.1
        port: 16160
        psk: ""                             # auto-generated if empty or "auto"
        version: v5.0.1                     # snell version to auto-download

    - type: mihomo
      enabled: false
      config:
        binary_path: /usr/local/bin/mihomo
        config_file_path: /etc/v2raymg/mihomo.yaml
        data_dir: /var/lib/v2raymg/mihomo
        external_controller: 127.0.0.1:9090 # mihomo REST API listen address (loopback only)
        secret: ""                          # REST API bearer token; empty disables auth
        release_tag: latest                 # GitHub release tag used by updater; "latest" = newest stable.
                                            # Set to "Prerelease-Alpha" to track the permanent alpha pre-release.
                                            # (Pre-stage-9 this field was named `version`; stage 9 renamed it.)
        auto_download: true                 # download via updater when binary is missing at start

# End Node configuration (effective when node_type=end)
end_node:
  name: node-1
  proxy_host: example.com
  listen: 0.0.0.0
  http_listen: 0.0.0.0   # HTTP server listen address (defaults to listen if empty)
  rpc_port: 9090
  http_port: 8080
  http_token: your-secret-token
  # jwt_secret: signing key for frontend JWT tokens (POST /login).
  # Required (end node). Minimum 16 characters. Service will refuse to start if missing or too short.
  jwt_secret: change-this-to-a-random-secret-at-least-16-chars
  # jwt_expire_hours: JWT token validity in hours. Default: 24.
  jwt_expire_hours: 24
  enable_prometheus: false
  enable_ping_check: false
  only_gateway: false
  ping:
    enable_icmp_ping: true       # requires root/cap_net_raw
    icmp_ping_interval: 5        # seconds
    icmp_ping_timeout: 1         # seconds
    enable_tcp_ping: true
    tcp_ping_interval: 5         # seconds
    tcp_ping_timeout: 1          # seconds
    node_sources:
      - type: file               # "file" or "remote"
        source: ./config/ping_nodes.yaml
      # - type: remote
      #   source: https://example.com/ping_nodes.yaml
      #   update_interval: 300   # seconds; only effective for "remote" type
  cluster:
    # The shared secret. It authenticates cluster members AND keys (via HKDF) all
    # end<->end gRPC traffic, so it is the ONLY membership boundary — there is no
    # cluster name any more. Must be at least 16 characters and genuinely random.
    token: cluster-secret-please-change-me
    # How often this node heartbeats to every peer (seconds).
    # Default 10 when unset; valid range 1-30. This is the clock the whole cluster
    # plane runs on — node liveness, directory convergence and cluster-user sync
    # all advance one step per interval. Raise it to cut chatter on large clusters,
    # but never past half of the 60s node timeout or healthy peers expire between
    # beats.
    heartbeat_interval_sec: 10
    # Node-directory delta sync on the end<->end heartbeat. When on (default), a
    # heartbeat carries only a digest of the sender's node set and the full
    # directory is exchanged just once per disagreement, instead of on every
    # tick — O(1) rather than O(N) bytes per heartbeat. Set to false to restore
    # the previous always-full-directory behaviour; safe to flip one node at a
    # time, since a peer that receives no digest falls back automatically.
    node_sum_sync: true
    # Static peers seed discovery. Since the center node was removed this is the
    # ONLY bootstrap path, and it is strictly better than the center was: a static
    # peer is never reclaimed by the 60s node timeout, and registration is
    # bidirectional so the seed learns the joining node immediately.
    #
    # One or two stable peers is enough — the rest of the directory propagates
    # between nodes, and discovered peers are persisted to the database so a
    # restart does not lose them. A node with no static peers and an empty
    # database cannot discover anyone (it can still be found by a peer that
    # already knows it); the server warns about this at startup.
    # Bootstrap addresses — host and port only.
    #
    # There is no name field: each node is identified by its own persistent id
    # (minted into its database on first start) and reports its own name in the
    # first response, so a label written here could only ever be an unverified
    # guess. A leftover `name:` from an older config is accepted and silently
    # ignored, so upgrading needs no edit.
    static_nodes: []
    #  - host: 10.0.0.1
    #    port: 9090
    #  - host: 10.0.0.2
    #    port: 9090

# The center node was removed. Use end_node.cluster.static_nodes for discovery.
# A config still carrying node_type: center, center_node:, center_node_host,
# center_token or cluster.name starts as a normal end node and warns about each
# ignored key at startup.

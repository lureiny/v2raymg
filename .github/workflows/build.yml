# Build and release on tag push
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: build

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build slim version
        run: make build

      - name: Build full version
        run: make build-full

      - name: Package
        run: |
          cd bin && \
          tar czvf ../v2raymg-slim.tar.gz v2raymg && \
          tar czvf ../v2raymg-full.tar.gz v2raymg-full

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" v2raymg-slim.tar.gz v2raymg-full.tar.gz

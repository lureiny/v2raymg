# Continuous integration: build + test on master pushes, PRs, and manual runs.
# Release packaging on v* tags is handled separately by build.yml; branch and
# tag push events don't overlap, so the two workflows never double-run.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build slim version
        run: make build

      - name: Build full version
        run: make build-full

      # Package + upload BEFORE tests so a compiled binary is always
      # downloadable from the run page (push / PR / manual dispatch),
      # even if the test step later fails. This is for ad-hoc testing,
      # not releases — v* tag releases stay in build.yml.
      - name: Package binaries
        run: |
          cd bin
          tar czf ../v2raymg-slim.tar.gz v2raymg
          tar czf ../v2raymg-full.tar.gz v2raymg-full

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2raymg-binaries-${{ github.sha }}
          path: |
            v2raymg-slim.tar.gz
            v2raymg-full.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Test
        run: go test ./... -count=1

      # Race-detector run, scoped to the packages whose concurrency fixes have
      # dedicated -race regression tests (the 2026-07 review campaign). Many of
      # those races (pointer swaps, state-lie map reuse) do NOT crash without
      # -race, so this step is their only CI protection. Every package listed
      # here was verified race-clean; add a package only after `go test -race`
      # passes for it locally. Kept separate from the plain `go test ./...`
      # above so a network-flaky non-concurrency test can't mask a real race.
      - name: Test (race, targeted)
        run: |
          go test -race -count=1 \
            ./pkg/cluster/... \
            ./pkg/rpc/... \
            ./pkg/proxy/forward/... \
            ./pkg/proxy/usermanager/... \
            ./pkg/proxy/containers/... \
            ./pkg/proxy/core/container/... \
            ./pkg/proxy/tools/process/... \
            ./pkg/certmgmt/... \
            ./pkg/collecter/...

  # Multi-node regression: a real 3-node cluster of v2raymg subprocesses talking
  # real gRPC, driven entirely through the HTTP API.
  #
  # This is the ONLY coverage of the cluster plane end to end — the in-process
  # unit tests call the RPC handlers directly and therefore skip the encryption
  # codec, the anti-replay check and the method binding. Every HTTP route must
  # have a case here; pkg/http/route_coverage_test.go (which runs in build-test
  # above, untagged) fails the build when a route is added without one.
  #
  # Separate job so it runs in parallel and a cluster flake never masks a unit
  # failure. No external binaries or network are required: proxy containers are
  # optional here and a container that fails to start is non-fatal for the server.
  cluster-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cluster e2e (3-node cluster)
        run: go test -tags=integration ./pkg/proxy/systemtest/ -run 'TestClusterE2E' -v -timeout 20m

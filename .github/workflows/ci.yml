# Continuous integration: build + test on master pushes, PRs, and manual runs.
# Release packaging on v* tags is handled separately by build.yml; branch and
# tag push events don't overlap, so the two workflows never double-run.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build slim version
        run: make build

      - name: Build full version
        run: make build-full

      # Package + upload BEFORE tests so a compiled binary is always
      # downloadable from the run page (push / PR / manual dispatch),
      # even if the test step later fails. This is for ad-hoc testing,
      # not releases — v* tag releases stay in build.yml.
      - name: Package binaries
        run: |
          cd bin
          tar czf ../v2raymg-slim.tar.gz v2raymg
          tar czf ../v2raymg-full.tar.gz v2raymg-full

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2raymg-binaries-${{ github.sha }}
          path: |
            v2raymg-slim.tar.gz
            v2raymg-full.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Test
        run: go test ./... -count=1

syntax = "proto3";

option go_package = "github.com/lureiny/v2raymg/server/proto";

package proto;

message User {
    string name = 1;
    string passwd = 2;
    int64 expire_time = 3;
    repeated string tags = 4;
    int64 downlink = 5;
    int64 uplink = 6;
}

enum BuilderType {
    UnknowBuilderType = 0;
    VLESSSettingBuilderType = 10;
	VMESSSettingBuilderType = 11;
	TrojanSettingBuilderType = 12;
	SSSettingBuilderType = 13;
	TCPBuilderType = 20;
	WSBuilderType = 21; 
	QuicBuilderType = 22; 
	MkcpBuilderType = 23;
	GrpcBuilderType = 24;
	HttpBuilderType = 25;
}

message NodeAuthInfo {
    string token = 1;
    Node node = 2;
}

message GetUsersReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetUsersRsp {
    int32 code = 1;
    string msg = 2;
    repeated User users = 3;
}

message UserOpReq {
    NodeAuthInfo node_auth_info = 1;
    repeated User users = 2;
}

message UserOpRsp {
    int32 code = 1;
    string msg = 2;
}

message GetSubReq {
    NodeAuthInfo node_auth_info = 1;
    User user = 2;
    repeated string exclude_protocols = 3;
    bool use_sni = 4;
    string user_agent = 5; // client User-Agent, used to select subscription format on node side
}

message GetSubRsp {
    int32 code = 1;
    string msg = 2;
    repeated string uris = 3;      // raw URIs (legacy, xray-only protocols with URI)
    string formatted_sub = 4;      // formatted subscription string (all protocols including snell)
}

message HeartBeatReq {
    NodeAuthInfo node_auth_info = 1;
}

message Node {
    string host = 1;
    int32 port = 2;
    string cluster_name = 3;
    string name = 4;
}

message HeartBeatRsp {
    int32 code = 1;
    string msg = 2;
    map<string, Node> nodesMap = 3;
}

message Nodes {
    map<string, Nodes> nodes = 1;
}

message RegisterNodeReq {
    NodeAuthInfo node_auth_info = 1;
}

message RegisterNodeRsp {
    int32 code = 1;
    string msg = 2;
    bytes data  = 3;  // end node 节点间注册返回token(string), 注册到center node返回[]Node
}

message GetBandwidthStatsReq {
    NodeAuthInfo node_auth_info = 1;
}

message Stats {
    string name = 1;
    string type = 2;
    int64 downlink = 3;
    int64 uplink = 4;
    string proxy = 5; // proxy name (DEPRECATED: use protocol + container instead)
    string source = 6;
    string protocol = 7; // protocol: vmess, vless, trojan, shadowsocks, snell, hysteria2, etc.
    string container = 8; // container type: xray, snell, hysteria
}

message GetBandwidthStatsRsp {
    int32 code = 1;
    string msg = 2;
    repeated Stats stats = 3;
}

message InboundOpReq {
    NodeAuthInfo node_auth_info = 1;
    string inboundInfo = 2; // inbound info 添加inbound时为inbound对应的base64, 删除时为tag
}

message InboundOpRsp {
    int32 code = 1;
    string msg = 2;
}

message TransferInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
    int32 new_port = 3;
}

message CopyInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string src_tag = 2;
    string new_tag = 3;
    int32 new_port = 4;
    bool is_copy_user = 5;
    string new_protocol = 6;
}

message CopyUserReq {
    NodeAuthInfo node_auth_info = 1;
    string src_tag = 2;
    string dst_tag = 3;
}

message GetInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
}

message GetInboundRsp {
    int32 code = 1;
    string msg = 2;
    string data = 3;
}

// InboundInfo represents a single inbound entry across all containers.
message InboundInfo {
    string container = 1; // container type: "xray" / "snell" / "hysteria"
    string name = 2;      // inbound unique identifier within the container (tag)
}

message ListInboundReq {
    NodeAuthInfo node_auth_info = 1;
}

message ListInboundRsp {
    int32 code = 1;
    string msg = 2;
    repeated InboundInfo inbounds = 3;
}

message DeleteInboundByNameReq {
    NodeAuthInfo node_auth_info = 1;
    string container = 2; // "xray" / "snell" / "hysteria"
    string name = 3;      // inbound tag
}

message UpdateProxyReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
}

message UpdateProxyRsp {
    int32 code = 1;
    string msg = 2;
}

message AdaptiveOpReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string ports = 2; // 可以为port range port1-port2
    repeated string tags = 3;
}

message AdaptiveReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string tags = 2;
}

message AdaptiveRsp {
    int32 code = 1;
    string msg = 2;
}

message SetGatewayModelReq {
    NodeAuthInfo node_auth_info = 1;
    bool enableGatewayModel = 2;
}

message SetGatewayModelRsp {
    int32 code = 1;
    string msg = 2;
}

message ObtainNewCertReq {
    NodeAuthInfo node_auth_info = 1;
    string domain = 2;
}

message ObtainNewCertRsp {
    int32 code = 1;
    string msg = 2;
}

message FastAddInboundReq {
    NodeAuthInfo node_auth_info = 1;
    BuilderType inboundBuilderType = 2;
    BuilderType streamBuilderType = 3;
    int32 port = 4;
    string domain = 5;
    bool isXtls = 6;
    string tag = 7;
    string container_type = 8; // "xray"(default) or "snell"
}

message FastAddInboundRsp {
    int32 code = 1;
    string msg = 2;
}

message TransferCertReq {
    NodeAuthInfo node_auth_info = 1;
    string domain = 2;
    bytes cert_data = 3;
    bytes key_datas = 4;
}

message TransferCertRsp {
    int32 code = 1;
    string msg = 2;
}

message Cert {
    string domain = 1;
    string key_file = 2;
    string cert_file = 3;
    string expire_time = 4;
}

message GetCertsReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetCertsRsp {
    int32 code = 1;
    repeated Cert certs = 2;
}

message ClearUsersReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string users = 2;
}

message ClearUsersRsp {
    int32 code = 1;
    string msg = 2;
}

message PingMetric {
    string host = 1; // ip or domain
    string source = 2;
    repeated PingResult results = 3;
}

message PingResult {
    string geo = 1; // location
    string isp = 2; // provider
    string ping_ip = 3; // ip to ping
    string ping_checker = 4;
    float max_delay = 10;
    float min_delay = 11;
    float st_dev_delay = 12;
    float avg_delay = 13;
    float loss = 14; // 丢包率
    float latest_delay = 15;
}

message GetPingMetricReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetPingMetricRsp {
    int32 code = 1;
    string msg = 2;
    PingMetric metric = 3;
}

message SetPingCheckReq {
    NodeAuthInfo node_auth_info = 1;
    bool enable_ping_check = 2;
}
message SetPingCheckRsp {
    int32 code = 1;
    string msg = 2;
}

message NodeMetrics {
    string host = 1; // ip or domain
    string source = 2;

    repeated bytes serialized_metrics = 10;  // prometheus dto.MetricFamily
}

message GetNodeMetricReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetNodeMetricRsp {
    int32 code = 1;
    string msg = 2;

    NodeMetrics node_metrics = 10;
}

service EndNodeAccess {
    // user
    rpc GetUsers(GetUsersReq) returns (GetUsersRsp) {}
    rpc AddUsers(UserOpReq) returns (UserOpRsp) {}
    rpc DeleteUsers(UserOpReq) returns (UserOpRsp) {} // 支持tag级删除
    rpc ClearUsers(ClearUsersReq) returns (ClearUsersRsp) {} // 完全删除
    rpc UpdateUsers(UserOpReq) returns (UserOpRsp) {}
    rpc ResetUser(UserOpReq) returns (UserOpRsp) {}
    rpc GetSub(GetSubReq) returns (GetSubRsp) {}
    rpc GetBandWidthStats(GetBandwidthStatsReq) returns (GetBandwidthStatsRsp) {}

    // system
    rpc HeartBeat(HeartBeatReq) returns (HeartBeatRsp) {}
    rpc RegisterNode(RegisterNodeReq) returns (RegisterNodeRsp) {}
    rpc SetGatewayModel(SetGatewayModelReq) returns (SetGatewayModelRsp) {}
    rpc SetPingCheck(SetPingCheckReq) returns (SetPingCheckRsp) {}
    
    // inbound
    rpc AddInbound(InboundOpReq) returns (InboundOpRsp) {}
    rpc DeleteInbound(InboundOpReq) returns (InboundOpRsp) {}
    rpc TransferInbound(TransferInboundReq) returns (InboundOpRsp) {}
    rpc CopyInbound(CopyInboundReq) returns (InboundOpRsp) {}
    rpc CopyUser(CopyUserReq) returns (InboundOpRsp) {}
    rpc GetInbound(GetInboundReq) returns (GetInboundRsp) {}
    rpc ListInbound(ListInboundReq) returns (ListInboundRsp) {}
    rpc DeleteInboundByName(DeleteInboundByNameReq) returns (InboundOpRsp) {}

    // proxy
    rpc UpdateProxy(UpdateProxyReq) returns (UpdateProxyRsp) {}
    rpc AddAdaptiveConfig(AdaptiveOpReq) returns (AdaptiveRsp) {}
    rpc DeleteAdaptiveConfig(AdaptiveOpReq) returns (AdaptiveRsp) {}
    rpc Adaptive(AdaptiveReq) returns (AdaptiveRsp) {} // 外部调用的主动修改接口
    rpc FastAddInbound(FastAddInboundReq) returns (FastAddInboundRsp) {}

    // cert
    rpc ObtainNewCert(ObtainNewCertReq) returns (ObtainNewCertRsp) {}
    rpc TransferCert(TransferCertReq) returns (TransferCertRsp) {}
    rpc GetCerts(GetCertsReq) returns (GetCertsRsp) {}

    /// metric
    rpc GetPingMetric(GetPingMetricReq) returns (GetPingMetricRsp) {}
    rpc GetNodeMetric(GetNodeMetricReq) returns (GetNodeMetricRsp) {}
}

message GetClutersReq {
    string cluster_name = 1;
}

message GetClutersRsp {
    repeated string cluster_names = 1;
}

message GetNodesReq {
    string cluster_name = 1;
}

message GetNodesRsp {
    string cluster_name = 1;
    map<string, Node> nodesMap = 2;
}

service CenterNodeAdmin {
    rpc GetCluters(GetClutersReq) returns (GetClutersRsp) {}
    rpc GetNodes(GetNodesReq) returns (GetNodesRsp) {}
}

service CenterNodeAccess {
    rpc HeartBeat(HeartBeatReq) returns (HeartBeatRsp) {}
    rpc RegisterNode(RegisterNodeReq) returns (RegisterNodeRsp) {}
}
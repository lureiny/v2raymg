syntax = "proto3";

option go_package = "github.com/lureiny/v2raymg/server/proto";

package proto;

message User {
    string name = 1;
    string passwd = 2; // login password input (AddUsers/UpdateUsers only, never returned in responses)
    int64 expire_time = 3;
    reserved 4;
    int64 downlink = 5;
    int64 uplink = 6;
    string role = 7;
    // Bandwidth limits (bytes/sec). Sentinel: 0=no change, -1=remove limit, >0=set.
    int64 upload_bps = 8;
    int64 download_bps = 9;
    // Client limits. Sentinel: 0=no change, -1=remove limit, >0=set.
    int32 max_clients = 10;
    int32 client_recycle_delay_sec = 11;
    int32 client_drain_sec = 12;
    string group = 13;
    string auth_token = 14;  // proxy auth token (UUID), returned by GetUsers/ClusterSync
    string login_password_hash = 15; // bcrypt hash of login password, propagated via ClusterSync
}

enum BuilderType {
    UnknowBuilderType = 0;
    VLESSSettingBuilderType = 10;
	VMESSSettingBuilderType = 11;
	TrojanSettingBuilderType = 12;
	SSSettingBuilderType = 13;
	// 14-16 added for mihomo-side protocol expansion (plan T-M-P0-06).
	// Old end-nodes that don't know these values fall through
	// end_node_inbound.go's default branch and return "unsupport protocol",
	// which is the intended behaviour — a legacy peer must refuse to
	// handle a protocol it cannot render. Rolling new protocols requires
	// all relevant end-nodes to be upgraded.
	Hysteria2SettingBuilderType = 14;
	TUICSettingBuilderType = 15;
	AnyTLSSettingBuilderType = 16;
	TCPBuilderType = 20;
	WSBuilderType = 21;
	QuicBuilderType = 22;
	MkcpBuilderType = 23;
	GrpcBuilderType = 24;
	HttpBuilderType = 25;
}

message NodeAuthInfo {
    string token = 1;
    Node node = 2;
    // Anti-replay fields (added 2026-07): every request carries a fresh
    // timestamp + random nonce, and the destination node name, so the server
    // can reject stale/duplicate frames and frames captured for a different node.
    int64 timestamp_us = 3;
    bytes nonce = 4;
    string dest_node = 5;
    // dest_method binds the (encrypted, authenticated) payload to the gRPC
    // method it was built for. The server rejects a request whose dest_method
    // differs from the dispatched method, so an on-path attacker on the plaintext
    // transport cannot move a ciphertext to a sibling method that shares the same
    // request type (e.g. ResetUserTraffic -> DeleteUsers, both UserOpReq). Added
    // 2026-07; stamped by the client interceptor, checked in the server interceptor.
    string dest_method = 6;
}

message GetUsersReq {
    NodeAuthInfo node_auth_info = 1;
    bool include_all = 2; // If true, return all users regardless of group visibility (admin view).
}

message GetUsersRsp {
    int32 code = 1;
    string msg = 2;
    repeated User users = 3;
}

message ProfileInbound {
    string tag = 1;
    string container = 2;
    int32 port = 3;
}

message GetProfileReq {
    NodeAuthInfo node_auth_info = 1;
    string username = 2;
}

message GetProfileRsp {
    int32 code = 1;
    string msg = 2;
    string username = 3;
    string role = 4;
    int64 expire_time = 5;
    int64 traffic_limit = 6;
    int64 uplink = 7;
    int64 downlink = 8;
    string proxy_password = 9;
    repeated ProfileInbound inbounds = 10;
}

message UserOpReq {
    NodeAuthInfo node_auth_info = 1;
    repeated User users = 2;
}

message UserOpRsp {
    int32 code = 1;
    string msg = 2;
}

message GetSubReq {
    NodeAuthInfo node_auth_info = 1;
    User user = 2;
    repeated string exclude_protocols = 3;
    bool use_sni = 4;
    string user_agent = 5; // client User-Agent, used to select subscription format on node side
    string token = 6;      // auth token for token-only authentication (no username needed)
}

message GetSubRsp {
    int32 code = 1;
    string msg = 2;
    repeated string uris = 3;      // raw URIs (legacy, xray-only protocols with URI)
    string formatted_sub = 4;      // formatted subscription string (all protocols including snell)
}

message UserDigest {
    string username = 1;
    int64 updated_at_us = 2;
    string origin_node = 3;
    bool deleted = 4;
    string hash = 5;
}

message ClusterUserSync {
    User user = 1;
    bool deleted = 2;
    int64 updated_at_us = 3;
    string origin_node = 4;
    string hash = 5;
}

message HeartBeatReq {
    NodeAuthInfo node_auth_info = 1;
    repeated UserDigest user_digests = 2;  // 本节点持有的 user 摘要列表（cluster_user.enabled=true 时填充）
    int64 timestamp_us = 3;  // 发起心跳的时间（微秒），用于防重放和流量特征消除
    // Node-directory delta sync (added 2026-07). The heartbeat response used to
    // carry the full node directory on every tick, making it O(N^2) bytes per
    // node per round. Now each side sends only a digest of its advertised node
    // set and the full map is exchanged only when the digests disagree.
    //
    // nodes_sum: ComputeNodesSum over this node's advertised set (which INCLUDES
    // itself — see Cluster.GetAdvertisedNodes). Empty means "not provided", i.e.
    // a legacy peer, and the server then answers with the full nodesMap exactly
    // as it did before. It is NOT used to decide a mismatch server-side;
    // reconciliation is driven entirely by the client.
    bytes nodes_sum = 4;
    // nodes: populated ONLY on a reconcile heartbeat — the extra call a client
    // makes immediately after seeing the response's nodes_sum differ from its
    // own. The server merges these and answers with its own full nodesMap, so
    // one reconcile exchange converges both directions.
    map<string, Node> nodes = 5;
}

message Node {
    string host = 1;
    int32 port = 2;
    // 3 was cluster_name, removed 2026-07. The cluster token is the only real
    // membership boundary: recvHeartBeatTime only advances through AuthAndTouch
    // (which verifies the token) and RegisterNode, and reportHeartBeatTime
    // requires our own registration to have been accepted, so a node that is
    // fully registered has necessarily proved possession of the cluster token.
    // The name was a second, redundant factor that could only ever cause
    // false mismatches. The field number stays reserved so it is never reused.
    reserved 3;
    string name = 4;
}

message HeartBeatRsp {
    int32 code = 1;
    string msg = 2;
    // Full node directory. Since the 2026-07 delta sync this is populated ONLY
    // when the peer is legacy (request carried no nodes_sum) or when the request
    // is a reconcile heartbeat (it carried nodes). A steady-state heartbeat
    // leaves it empty and carries nodes_sum alone.
    map<string, Node> nodesMap = 3;
    repeated string need_cluster_users = 4;  // 对端需要我补发完整 payload 的用户名列表
    // ComputeNodesSum over this node's advertised set. Always populated. The
    // client compares it against its own sum and, on a mismatch, immediately
    // issues one reconcile heartbeat carrying its full node map.
    bytes nodes_sum = 5;
}

message RegisterNodeReq {
    NodeAuthInfo node_auth_info = 1;
}

message RegisterNodeRsp {
    int32 code = 1;
    string msg = 2;
    bytes data  = 3;  // end node 节点间注册返回token(string), 注册到center node返回[]Node
}

message GetBandwidthStatsReq {
    NodeAuthInfo node_auth_info = 1;
}

message Stats {
    string name = 1;
    string type = 2;
    int64 downlink = 3;
    int64 uplink = 4;
    string proxy = 5; // proxy name (DEPRECATED: use protocol + container instead)
    string source = 6;
    string protocol = 7; // protocol: vmess, vless, trojan, shadowsocks, snell, hysteria2, etc.
    string container = 8; // container type: xray, snell, hysteria
}

message GetBandwidthStatsRsp {
    int32 code = 1;
    string msg = 2;
    repeated Stats stats = 3;
}

message InboundOpReq {
    NodeAuthInfo node_auth_info = 1;
    string inboundInfo = 2; // inbound info 添加inbound时为inbound对应的base64, 删除时为tag
}

message InboundOpRsp {
    int32 code = 1;
    string msg = 2;
}

message TransferInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
    int32 new_port = 3;
}

message CopyInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string src_tag = 2;
    string new_tag = 3;
    int32 new_port = 4;
    bool is_copy_user = 5;
    string new_protocol = 6;
}

message CopyUserReq {
    NodeAuthInfo node_auth_info = 1;
    string src_tag = 2;
    string dst_tag = 3;
}

message GetInboundReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
}

message GetInboundRsp {
    int32 code = 1;
    string msg = 2;
    string data = 3;
}

// InboundInfo represents a single inbound entry across all containers.
message InboundInfo {
    string container = 1; // container type: "xray" / "snell" / "hysteria"
    string name = 2;      // inbound unique identifier within the container (tag)
}

message ListInboundReq {
    NodeAuthInfo node_auth_info = 1;
}

message ListInboundRsp {
    int32 code = 1;
    string msg = 2;
    repeated InboundInfo inbounds = 3;
}

message DeleteInboundByNameReq {
    NodeAuthInfo node_auth_info = 1;
    string container = 2; // "xray" / "snell" / "hysteria"
    string name = 3;      // inbound tag
}

message UpdateProxyReq {
    NodeAuthInfo node_auth_info = 1;
    string tag = 2;
}

message UpdateProxyRsp {
    int32 code = 1;
    string msg = 2;
}

message AdaptiveOpReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string ports = 2; // 可以为port range port1-port2
    repeated string tags = 3;
}

message AdaptiveReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string tags = 2;
}

message AdaptiveRsp {
    int32 code = 1;
    string msg = 2;
}

message SetGatewayModelReq {
    NodeAuthInfo node_auth_info = 1;
    bool enableGatewayModel = 2;
}

message SetGatewayModelRsp {
    int32 code = 1;
    string msg = 2;
}

message ObtainNewCertReq {
    NodeAuthInfo node_auth_info = 1;
    string domain = 2;
}

message ObtainNewCertRsp {
    int32 code = 1;
    string msg = 2;
}

message FastAddInboundReq {
    NodeAuthInfo node_auth_info = 1;
    BuilderType inboundBuilderType = 2;
    BuilderType streamBuilderType = 3;   // deprecated: use transport string field instead
    int32 port = 4;
    string domain = 5;
    bool isXtls = 6;            // deprecated: use security field instead
    string tag = 7;
    string container_type = 8;  // "xray"(default) or "snell"
    string security = 9;        // "tls"/"xtls"/"reality"; overrides isXtls when non-empty
    string reality_target = 10; // Reality target server, e.g. "www.example.com:443"
    repeated string reality_server_names = 11; // allowed SNI list for Reality
    repeated string reality_short_ids = 12;    // short ID list for Reality
    string transport = 13;      // transport type string: "tcp","ws","grpc","httpupgrade","xhttp","splithttp"
    map<string, string> extra_params = 14; // additional params: ws_path, grpc_service_name, httpupgrade_path, xhttp_path, xhttp_mode, alpn, sniffing_enabled, etc.
}

message FastAddInboundRsp {
    int32 code = 1;
    string msg = 2;
}

message TransferCertReq {
    NodeAuthInfo node_auth_info = 1;
    string domain = 2;
    bytes cert_data = 3;
    bytes key_datas = 4;
}

message TransferCertRsp {
    int32 code = 1;
    string msg = 2;
}

message Cert {
    string domain = 1;
    string key_file = 2;
    string cert_file = 3;
    string expire_time = 4;
}

message GetCertsReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetCertsRsp {
    int32 code = 1;
    repeated Cert certs = 2;
}

message DeleteCertReq {
    NodeAuthInfo node_auth_info = 1;
    string domain = 2;
}

message DeleteCertRsp {
    int32 code = 1;
    string msg = 2;
}

message PingMetric {
    string host = 1; // ip or domain
    string source = 2;
    repeated PingResult results = 3;
}

message PingResult {
    string geo = 1; // location
    string isp = 2; // provider
    string ping_ip = 3; // ip to ping
    string ping_checker = 4;
    float max_delay = 10;
    float min_delay = 11;
    float st_dev_delay = 12;
    float avg_delay = 13;
    float loss = 14; // 丢包率
    float latest_delay = 15;
}

message GetPingMetricReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetPingMetricRsp {
    int32 code = 1;
    string msg = 2;
    PingMetric metric = 3;
}

message SetPingCheckReq {
    NodeAuthInfo node_auth_info = 1;
    bool enable_ping_check = 2;
}
message SetPingCheckRsp {
    int32 code = 1;
    string msg = 2;
}

message NodeMetrics {
    string host = 1; // ip or domain
    string source = 2;

    repeated bytes serialized_metrics = 10;  // prometheus dto.MetricFamily
}

message GetNodeMetricReq {
    NodeAuthInfo node_auth_info = 1;
}

message GetNodeMetricRsp {
    int32 code = 1;
    string msg = 2;

    NodeMetrics node_metrics = 10;
}

message NodeStatus {
  string node_name            = 1;
  bool   only_gateway         = 2;
  bool   cluster_user_enabled = 3;
  uint64 mem_total            = 4;  // bytes, from /proc/meminfo MemTotal
  uint64 mem_used             = 5;  // bytes, MemTotal - MemAvailable
  uint64 mem_available        = 6;  // bytes, from /proc/meminfo MemAvailable
  int32  num_goroutine        = 7;
  double cpu_percent           = 8;
  uint64 net_rx_bytes         = 9;
  uint64 net_tx_bytes         = 10;
  int32  tcp_connections      = 11;
  double net_rx_speed         = 12;  // bytes/sec
  double net_tx_speed         = 13;  // bytes/sec
  string version              = 14;  // build-time injected version string
}

message GetStatusReq {
  NodeAuthInfo node_auth_info = 1;
}

message GetStatusRsp {
  int32      code   = 1;
  string     msg    = 2;
  NodeStatus status = 3;
}

service EndNodeAccess {
    // user
    rpc GetUsers(GetUsersReq) returns (GetUsersRsp) {}
    rpc GetProfile(GetProfileReq) returns (GetProfileRsp) {}
    rpc AddUsers(UserOpReq) returns (UserOpRsp) {}
    rpc DeleteUsers(UserOpReq) returns (UserOpRsp) {} // 支持tag级删除
    rpc UpdateUsers(UserOpReq) returns (UserOpRsp) {}
    rpc ResetUser(UserOpReq) returns (UserOpRsp) {}
    rpc ResetUserTraffic(UserOpReq) returns (UserOpRsp) {}
    rpc ResetAuthToken(ResetAuthTokenReq) returns (ResetAuthTokenRsp) {}
    rpc RotateInboundPort(RotateInboundPortReq) returns (RotateInboundPortRsp) {}
    rpc RotateAllPorts(RotateAllPortsReq) returns (RotateAllPortsRsp) {}
    rpc GetSub(GetSubReq) returns (GetSubRsp) {}
    rpc GetBandWidthStats(GetBandwidthStatsReq) returns (GetBandwidthStatsRsp) {}

    // system
    rpc HeartBeat(HeartBeatReq) returns (HeartBeatRsp) {}
    rpc RegisterNode(RegisterNodeReq) returns (RegisterNodeRsp) {}
    rpc SetGatewayModel(SetGatewayModelReq) returns (SetGatewayModelRsp) {}
    rpc SetPingCheck(SetPingCheckReq) returns (SetPingCheckRsp) {}
    
    // inbound
    rpc AddInbound(InboundOpReq) returns (InboundOpRsp) {}
    rpc TransferInbound(TransferInboundReq) returns (InboundOpRsp) {}
    rpc CopyInbound(CopyInboundReq) returns (InboundOpRsp) {}
    rpc CopyUser(CopyUserReq) returns (InboundOpRsp) {}
    rpc GetInbound(GetInboundReq) returns (GetInboundRsp) {}
    rpc ListInbound(ListInboundReq) returns (ListInboundRsp) {}
    rpc DeleteInboundByName(DeleteInboundByNameReq) returns (InboundOpRsp) {}

    // proxy
    rpc UpdateProxy(UpdateProxyReq) returns (UpdateProxyRsp) {}
    rpc AddAdaptiveConfig(AdaptiveOpReq) returns (AdaptiveRsp) {}
    rpc DeleteAdaptiveConfig(AdaptiveOpReq) returns (AdaptiveRsp) {}
    rpc Adaptive(AdaptiveReq) returns (AdaptiveRsp) {} // 外部调用的主动修改接口
    rpc FastAddInbound(FastAddInboundReq) returns (FastAddInboundRsp) {}

    // cert
    rpc ObtainNewCert(ObtainNewCertReq) returns (ObtainNewCertRsp) {}
    rpc TransferCert(TransferCertReq) returns (TransferCertRsp) {}
    rpc GetCerts(GetCertsReq) returns (GetCertsRsp) {}
    rpc DeleteCert(DeleteCertReq) returns (DeleteCertRsp) {}

    /// metric
    rpc GetPingMetric(GetPingMetricReq) returns (GetPingMetricRsp) {}
    rpc GetNodeMetric(GetNodeMetricReq) returns (GetNodeMetricRsp) {}

    // cluster user
    rpc GetNodeGroups(GetNodeGroupsReq) returns (GetNodeGroupsRsp) {}
    rpc SetNodeGroups(SetNodeGroupsReq) returns (SetNodeGroupsRsp) {}
    rpc UpsertClusterUsers(UpsertClusterUsersReq) returns (UpsertClusterUsersRsp) {}

    // status
    rpc GetStatus(GetStatusReq) returns (GetStatusRsp) {}

    // container
    rpc GetContainers(GetContainersReq) returns (GetContainersRsp) {}
}

message GetNodeGroupsReq {
    NodeAuthInfo node_auth_info = 1;
}
message GetNodeGroupsRsp {
    int32 code = 1;
    string msg = 2;
    repeated string groups = 3;
}
message SetNodeGroupsReq {
    NodeAuthInfo node_auth_info = 1;
    repeated string groups = 2;
}
message SetNodeGroupsRsp {
    int32 code = 1;
    string msg = 2;
}

message UpsertClusterUsersReq {
    NodeAuthInfo node_auth_info = 1;
    repeated ClusterUserSync users = 2;
    bool from_admin = 3;  // true = Admin HTTP 写入（自动填充 version），false = Peer sync 写入（需版本仲裁）
}
message UpsertClusterUsersRsp {
    int32 code = 1;
    string msg = 2;
}

// --- Port rotation ---

message RotateInboundPortReq {
    NodeAuthInfo node_auth_info = 1;
    string username  = 2;
    string container = 3;
    string inbound   = 4;
    uint32 port      = 5;  // 0 = auto-allocate, >0 = preferred port
}
message RotateInboundPortRsp {
    int32  code = 1;
    string msg  = 2;
    uint32 port = 3;  // newly allocated port
}

message RotateAllPortsReq {
    NodeAuthInfo node_auth_info = 1;
    string username = 2;
}
message RotateAllPortsRsp {
    int32  code = 1;
    string msg  = 2;
    map<string, uint32> ports = 3;  // "container:inboundTag" → new listen port
}

message ResetAuthTokenReq {
    NodeAuthInfo node_auth_info = 1;
    string username = 2;
    string new_token = 3; // if non-empty, must be valid UUID v4; if empty, server auto-generates
}

message ResetAuthTokenRsp {
    int32  code = 1;
    string msg  = 2;
    string auth_token = 3;
}

message GetContainersReq {
    NodeAuthInfo node_auth_info = 1;
}
message GetContainersRsp {
    int32 code = 1;
    string msg = 2;
    repeated string containers = 3;
}

// The center node was removed in 2026-07. Discovery is handled entirely by
// static_nodes plus end<->end directory propagation: a static peer is never
// reclaimed by the node timeout and registration is bidirectional, so it seeds
// the cluster at least as well as a center did. The center was also the only
// default-plaintext channel in the cluster plane, and since the RPC hardening it
// carried the cluster token itself, so removing it closes that exposure.